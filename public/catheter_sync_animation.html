<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pump Mechanism – Animation</title>
<style>
  :root{
    --blue:#0094C5;
    --blue-dark:#0a7aa3;
    --bg:#d9eef7;
    --panel:#ffffff;
    --baseline:#cfe7f1;
    --label:#9bb2bd;
    --hi:#a9dcef;
  }
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    font-family:"Helvetica Neue",Arial,sans-serif;color:var(--blue);
  }
  .card{width:min(96vw,96vh);}
  /* animation canvas — taller than wide so the scene-3 dropdown has room to open
     downward into the lower part (pump/diagram stay top-anchored across all scenes) */
  .stage{aspect-ratio:5/6;background:var(--bg);box-sizing:border-box;position:relative;
         padding:6% 6% 4%;display:flex;flex-direction:column;align-items:center;
         justify-content:flex-start;overflow:hidden;}
  /* play button */
  .playoverlay{position:absolute;inset:0;z-index:5;cursor:pointer;
       display:flex;align-items:center;justify-content:center;
       background:rgba(217,238,247,.45);}
  .playoverlay.hidden{display:none;}
  .playbtn{width:90px;height:90px;border-radius:50%;border:none;background:var(--blue);
       cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.22);
       display:flex;align-items:center;justify-content:center;transition:transform .15s;}
  .playbtn:hover{transform:scale(1.07);}
  svg{display:block;width:100%;height:auto;}
  .title{font-size:46px;font-weight:800;color:var(--blue);text-align:center;
         margin:0 0 8px;height:140px;line-height:1.18;overflow:hidden;
         display:flex;align-items:center;justify-content:center;
         opacity:0;transition:opacity .45s ease;}      /* copy just fades — no movement */
  .title.show{opacity:1;}
  .device{width:48%;margin-bottom:2%;}
  .scene{display:none;width:100%;opacity:0;transition:opacity .45s ease;}
  .scene.active{display:block;}
  .scene.show{opacity:1;}
  /* constant-height control area keeps the diagram fixed across scenes */
  .ctrls{min-height:210px;position:relative;}

  /* section header */
  .head{display:flex;align-items:center;gap:14px;margin:16px 4px 14px;
        font-size:36px;font-weight:700;color:var(--blue);}
  .head svg{width:48px;height:48px;flex:0 0 auto;}

  /* slider (scene 2) */
  .slider{position:relative;height:64px;margin:28px 10px 0;}
  .slider .track{position:absolute;top:50%;left:0;right:0;height:16px;
        transform:translateY(-50%);background:var(--blue);border-radius:8px;}
  .slider .handle{position:absolute;top:50%;width:60px;height:60px;border-radius:50%;
        background:var(--blue);border:8px solid #fff;transform:translate(-50%,-50%);
        box-shadow:0 2px 8px rgba(0,0,0,.28);}
  .ends{display:flex;justify-content:space-between;margin:18px 8px 0;
        font-size:46px;font-weight:700;color:var(--blue);}

  /* form (scene 3) */
  .form{display:flex;gap:48px;flex-wrap:wrap;margin:8px 6px 0;align-items:flex-end;}
  .fld{font-size:30px;font-weight:700;color:var(--blue);}
  .fld .row{display:flex;align-items:center;gap:14px;margin-top:16px;font-weight:400;}
  /* scene 3: dropdown + dose side by side (saves vertical space); a little gap below the diagram */
  .d3{margin-bottom:26px;}
  .s3row{display:flex;gap:36px;align-items:flex-start;}
  .s3row .fld{flex:1;min-width:0;}
  /* dropdown + dose field share the exact same full-width input size */
  .dd,.dosebox{margin-top:16px;width:100%;height:82px;box-sizing:border-box;
      border:3px solid var(--blue);border-radius:14px;padding:0 26px;background:#fff;
      font-size:34px;font-weight:700;color:#0a3b4d;display:flex;align-items:center;}
  .dd{justify-content:space-between;}
  .dd.empty,.dosebox.ph{color:#9bb2bd;font-weight:400;}
  #ddChev{width:42px;height:42px;flex:0 0 auto;transition:transform .28s ease;}
  .dd.open #ddChev{transform:rotate(180deg);}
  /* dropdown list overlay (scene 3) */
  .ddwrap{position:relative;}
  /* Opens downward into the lower part of the page (the stage is tall enough). */
  .ddlist{position:absolute;left:0;right:0;top:calc(100% + 10px);z-index:6;background:#fff;
      border:3px solid var(--blue);border-radius:14px;overflow:hidden;
      opacity:0;transform:translateY(-10px);pointer-events:none;
      transition:opacity .26s ease, transform .26s ease;}
  .ddlist.open{opacity:1;transform:translateY(0);}
  .ddrow{display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 24px;
      font-size:28px;font-weight:700;color:#0a3b4d;}
  .ddrow + .ddrow{border-top:2px solid #eaf1f5;}
  .ddrow.sel{background:#e6f4f9;color:var(--blue);}
  .ck{width:40px;height:40px;border-radius:50%;border:3px solid #cdd9e0;box-sizing:border-box;
      display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .ck svg{width:24px;height:24px;opacity:0;}
  .ck svg path{stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .ddrow.sel .ck{background:var(--blue);border-color:var(--blue);}
  .ddrow.sel .ck svg{opacity:1;}

  /* tabs */
  .tabs{display:flex;gap:16px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
  .tabs button{flex:0 0 auto;border:2.5px solid var(--blue);background:#fff;color:var(--blue);
        border-radius:44px;padding:16px 34px;font-size:28px;font-weight:700;cursor:pointer;}
  .tabs button.on{background:var(--blue);color:#fff;}
  .caption{display:none;text-align:center;color:#5a7d8b;font-size:15px;margin-top:14px;min-height:20px;
           opacity:0;transition:opacity .45s ease;}
  .caption.show{opacity:1;}
</style>
</head>

<script>
const NS="http://www.w3.org/2000/svg";
const BLUE="#0094C5";
const BASE=150, MAXTOP=34;                 // panel baseline & highest bar top
const X1=60, X2=660;                        // bar field (inset for padding)
const ease=p=> p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
const mk=(p,a)=>{const e=document.createElementNS(NS,"rect");for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};

/* ---------- SCENE 1 : delivery ---------- */
const N1=20, DEV1=8, FULL1=60;   // 20 slots but only develop the first part (quicker), 1 pulse = 1 unit
const bars1=[];
{const g=document.getElementById("bars1");
 for(let i=0;i<N1;i++){const x=X1+i*(X2-X1)/(N1-1)-6.5;
   bars1.push(mk(g,{x,width:13,rx:2.5,fill:BLUE}));}}
const PUSH=400,FADE=320,PAUSE=200,CYC=PUSH+FADE+PAUSE,HOLD=1100,TOT1=DEV1*CYC+HOLD;
const Ax=565,Ay=98,DX=0.76,DY=-0.65,fluid=document.getElementById("fluid");
const fT=(s,off)=>`translate(${Ax-s*Ax+DX*off} ${Ay-s*Ay+DY*off}) scale(${s})`;
function setBar(b,h){b.setAttribute("y",BASE-h);b.setAttribute("height",Math.max(h,0.01));}
function scene1(t){
  t%=TOT1;
  if(t<DEV1*CYC){
    const ci=Math.floor(t/CYC),lo=t-ci*CYC,p=ease(Math.min(lo/PUSH,1));
    for(let i=0;i<N1;i++) setBar(bars1[i], i<ci?FULL1 : i===ci?FULL1*p : 0);
    if(lo<PUSH){fluid.setAttribute("opacity",p);fluid.setAttribute("transform",fT(0.30+0.70*p,-16*(1-p)));}
    else if(lo<PUSH+FADE){const f=(lo-PUSH)/FADE;fluid.setAttribute("opacity",1-f);fluid.setAttribute("transform",fT(1+0.10*f,10*f));}
    else fluid.setAttribute("opacity",0);
  }else{for(let i=0;i<N1;i++) setBar(bars1[i], i<DEV1?FULL1:0); fluid.setAttribute("opacity",0);}
}

/* ---------- SCENE 2 : delivery frequency (stacking + double fire) ---------- */
const g2=document.getElementById("bars2"), handle2=document.getElementById("handle2");
const bars2=[]; for(let i=0;i<20;i++) bars2.push(mk(g2,{rx:2.5,fill:BLUE}));
const S2_HS=60, S2_SEG=60, S2_GAP=6, S2_W=13, HL="#00BCE4";  // 1 pulse = 1 unit; stack = 2 units (~double)
const xSingle=i=>X1+i*(X2-X1)/19;
const pairC=j=>X1+(2*j+0.5)*(X2-X1)/19;
function setRect(b,x,y,h){b.setAttribute("x",x-S2_W/2);b.setAttribute("width",S2_W);
  b.setAttribute("y",y);b.setAttribute("height",Math.max(h,0.01));}
// mergeT: 0 = 20 single bars ; 1 = 10 stacks of two. hl1/hl2 highlight the FIRST stack's lower/upper segment.
function renderS2(mergeT,hi){
  const stackTopY=BASE-(2*S2_SEG+S2_GAP);
  for(let i=0;i<20;i++){
    const b=bars2[i], j=i>>1, top=i&1, xc=pairC(j);
    const x=xSingle(i)+(xc-xSingle(i))*mergeT;
    const h=S2_HS+(S2_SEG-S2_HS)*mergeT;
    const y=top ? (BASE-S2_HS)+(stackTopY-(BASE-S2_HS))*mergeT : BASE-h;
    setRect(b,x,y,h);
    b.setAttribute("fill", hi.has(i) ? HL : BLUE);      // light up bars as the pump fires them
  }
}
function s2fire(fp){                              // one quick fluid spurt
  if(fp<0.45){ const p=fp/0.45; fluid.setAttribute("opacity",p); fluid.setAttribute("transform",fT(0.3+0.7*p,-16*(1-p))); }
  else{ const g=(fp-0.45)/0.55; fluid.setAttribute("opacity",1-g); fluid.setAttribute("transform",fT(1+0.1*g,10*g)); }
}
const S2_SPURT=220;
const BEAT_HI=340, N_HI=10, HIEND=BEAT_HI*N_HI;          // sweep only the first half (quicker)
const MERGE=1000;
const BEAT_LO=1050, F2=300, N_LO=5, LOEND=BEAT_LO*N_LO;  // fewer deliveries: two fires then long pause (first half)
const UNMERGE=1000;
const TOT2=HIEND+MERGE+LOEND+UNMERGE;
function scene2(t){
  t%=TOT2;
  let mergeT=0, firing=false; const hi=new Set();
  if(t<HIEND){                                            // steady rhythm, one fire per delivery
    const b=Math.floor(t/BEAT_HI), lb=t-b*BEAT_HI;
    if(lb<S2_SPURT){ firing=true; s2fire(lb/S2_SPURT); hi.add(b); }
  } else if(t<HIEND+MERGE){
    mergeT=ease((t-HIEND)/MERGE);                         // merge pairs -> stacks
  } else if(t<HIEND+MERGE+LOEND){
    mergeT=1; const lt=t-(HIEND+MERGE);
    const b=Math.floor(lt/BEAT_LO), lb=lt-b*BEAT_LO;
    if(lb<S2_SPURT){ firing=true; s2fire(lb/S2_SPURT); hi.add(2*b); }               // fire 1 -> lower
    else if(lb>=F2 && lb<F2+S2_SPURT){ firing=true; s2fire((lb-F2)/S2_SPURT); hi.add(2*b+1); } // fire 2 -> upper
  } else {
    mergeT=1-ease((t-(HIEND+MERGE+LOEND))/UNMERGE);       // back to singles
  }
  renderS2(mergeT,hi);
  if(!firing) fluid.setAttribute("opacity",0);
  handle2.style.left=((1-mergeT)*100)+"%";   // right = many single deliveries, far left = doubled/stacked
}

/* ---------- SCENE 3 : dosing windows ---------- */
const N3=20, BASEH=FULL1, HIGH=2*FULL1, TOPBOX=BASE-HIGH-8; // base 15mcg/h -> window 30mcg/h = double
const g3=document.getElementById("bars3"), bars3=[];
const winA=5, winB=9;                               // bar indices inside window
for(let i=0;i<N3;i++){const x=X1+i*(X2-X1)/(N3-1)-6.5;
  bars3.push(mk(g3,{x,width:13,rx:2.5,fill:BLUE}));}
const selBox=document.getElementById("selBox"),hiBox=document.getElementById("hiBox"),winLbl=document.getElementById("winLbl");
const dose=document.getElementById("dose"),dd=document.getElementById("dd"),ddText=document.getElementById("ddText");
const ddlist=document.getElementById("ddlist"), ddrows=[...document.querySelectorAll(".ddrow")];
const SEL_START=0, SEL_N=5;                        // check rows 06:00-08:00 (= 5 window bars)
const wx1=X1+winA*(X2-X1)/(N3-1)-16, wx2=X1+winB*(X2-X1)/(N3-1)+16, wW=wx2-wx1, wC=(wx1+wx2)/2;
const TOT3=10000, segE=(t,a,d)=> t<=a?0 : (t>=a+d?1 : ease((t-a)/d));
// Sequence: dropdown opens -> the 5 window times get checked (bars select) -> dropdown
// closes with the range chosen -> the dose is raised for the selected bars.
function scene3(t){
  t%=TOT3;
  const listVisible = t>=700 && t<4750;
  let nSel = 0;
  if(t>=1500) nSel = Math.min(SEL_N, Math.floor((t-1500)/280)+1);   // check one row every 280ms
  const selShow = t>=1500 ? Math.min(1,(t-1500)/700) : 0;           // selection box / highlight fade-in
  const confirmed = t>=4750;                                        // dropdown closed, range chosen
  const grow = segE(t,5300,1500);                                   // dose rises for the selected bars

  // ---- dropdown list ----
  ddlist.classList.toggle("open", listVisible);
  dd.classList.toggle("open", listVisible);
  for(let k=0;k<ddrows.length;k++)
    ddrows[k].classList.toggle("sel", listVisible && k>=SEL_START && k<SEL_START+nSel);
  if(confirmed){ dd.classList.remove("empty"); ddText.textContent="06:00 - 08:00"; }
  else { dd.classList.add("empty"); ddText.textContent="Select a preset time..."; }

  // ---- diagram ----
  for(let i=0;i<N3;i++){
    const inWin=i>=winA&&i<=winB;
    setBar(bars3[i], inWin ? BASEH+(HIGH-BASEH)*grow : BASEH);
    bars3[i].setAttribute("fill", (inWin && selShow>0.2) ? HL : BLUE);   // light up selected bars
  }
  selBox.setAttribute("opacity",selShow);
  selBox.setAttribute("x",wx1);selBox.setAttribute("width",wW);
  selBox.setAttribute("y",TOPBOX);selBox.setAttribute("height",(BASE-TOPBOX)+4);
  hiBox.setAttribute("opacity",0.28*selShow);
  hiBox.setAttribute("x",wx1);hiBox.setAttribute("width",wW);
  hiBox.setAttribute("y",TOPBOX);hiBox.setAttribute("height",BASE-TOPBOX);
  winLbl.setAttribute("x",wC);winLbl.setAttribute("opacity",selShow);

  // ---- dose field ----
  if(grow>0.05){dose.classList.remove("ph");dose.textContent=Math.round(30*grow)+" mcg/h";}
  else{dose.classList.add("ph");dose.textContent="mcg/h";}
}

/* ---------- player ---------- */
let scene=1, start=performance.now(), playing=false;
const ANIM_DELAY=700;         // pump+diagram show first, then the animation starts
const HEADLINE_DELAY=1450;    // headline develops in shortly AFTER the animation starts
const titleEl=document.getElementById("title");
const captionEl=document.getElementById("caption");
const playOv=document.getElementById("playOv");
const titles={
 1:"[Name] delivers medication in quick pulses",
 2:"Decide whether you want your deliveries spread out or with longer pauses in between",
 3:"Raise the delivery dose for one or more deliveries"
};
const captions={
 1:"Medication is delivered in quick pulses — one bar per pulse across the day.",
 2:"With many deliveries the pump fires in a steady rhythm. Lower the frequency and it fires two pulses back-to-back, then waits longer — each delivery a stack of two.",
 3:"Select a time window to increase the dose just for that period (here 06:30–08:00, 30 mcg/h)."
};

const FADE_MS=470;                 // matches the CSS opacity transition
const DUR={1:ANIM_DELAY+TOT1, 2:ANIM_DELAY+TOT2, 3:ANIM_DELAY+TOT3};  // one full loop per step
const scenesEls=[...document.querySelectorAll(".scene")];
const tabsEls=[...document.querySelectorAll(".tabs button")];
let advTimer=null, swapTimer=null, copyTimer=null;

// swap diagram + copy while everything is faded out, then fade the new content back in
function mountScene(s){
  scene=s; start=performance.now();
  scenesEls.forEach(el=>{ const on=+el.dataset.scene===s; el.classList.toggle("active",on); if(!on) el.classList.remove("show"); });
  tabsEls.forEach(x=>x.classList.toggle("on",+x.dataset.go===s));
  titleEl.textContent=titles[s]; captionEl.textContent=captions[s];
  const active=scenesEls.find(el=>+el.dataset.scene===s);
  void active.offsetWidth;
  active.classList.add("show");                                   // diagram fades in
  clearTimeout(copyTimer);
  copyTimer=setTimeout(()=>{ if(scene===s&&playing){ titleEl.classList.add("show"); captionEl.classList.add("show"); } }, HEADLINE_DELAY);
  clearTimeout(advTimer);
  advTimer=setTimeout(()=>goScene(s%3+1), DUR[s]);
}
// fade the current content out, then mount the next step (no cross-blend)
function goScene(s){
  clearTimeout(advTimer); clearTimeout(swapTimer); clearTimeout(copyTimer);
  titleEl.classList.remove("show"); captionEl.classList.remove("show");
  scenesEls.forEach(el=>el.classList.remove("show"));
  swapTimer=setTimeout(()=>mountScene(s), FADE_MS);
}
function play(s){
  playOv.classList.add("hidden");
  if(!playing){ playing=true; start=performance.now(); mountScene(s||scene); }  // first play: no fade-out blink
  else goScene(s||scene);
}

function loop(now){
  const at = playing ? Math.max(0,(now-start)-ANIM_DELAY) : 0;  // frozen on initial frame until play
  if(scene===1){ scene1(at); }
  else if(scene===2){ scene2(at); }               // scene 2 drives its own fluid (double fire)
  else { scene3(at); fluid.setAttribute("opacity",1); fluid.setAttribute("transform",fT(1,0)); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

playOv.addEventListener("click",()=>play(scene));
document.querySelectorAll(".tabs button").forEach(b=>{
  b.addEventListener("click",()=>play(+b.dataset.go));
});
// Auto-start as soon as the animation loads (no extra play click needed).
play(scene);
</script>
</body>
